<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08051a"><title>EXE PAK • User Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#7c3aed30,transparent 30%),#070714;color:#fff;font-family:Tahoma,Arial,sans-serif}.w{width:min(1050px,calc(100% - 26px));margin:auto;padding:25px 0}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:25px;font-weight:900}.brand b{color:#a78bfa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#111029cc;border:1px solid #ffffff14;border-radius:19px;padding:16px;margin:12px 0}.num{font-size:26px;font-weight:900;color:#a78bfa}.muted{color:#9996b0;font-size:11px}.btn{display:inline-block;padding:10px 13px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;text-decoration:none;border:0;cursor:pointer}.item{padding:11px;border:1px solid #ffffff10;border-radius:13px;background:#ffffff04;margin:7px 0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#7c3aed20;color:#c4b5fd;font-size:10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body><main class=w><div class=top><div><div class=brand>💜💙 <b>EXE PAK</b> PANEL</div><div class=muted>پروفایل، XP، اعلان‌ها و فعالیت‌های تو</div></div><div><a class=btn href="/">خانه</a> <a class=btn href="/upload.html">📦 انتشار</a></div></div><div id=msg class=card>در حال بارگذاری...</div><div class=grid><div class=card>📦 پک‌ها<div id=posts class=num>—</div></div><div class=card>⬇️ دانلود<div id=downloads class=num>—</div></div><div class=card>👁 بازدید<div id=views class=num>—</div></div><div class=card>⚡ XP<div id=xp class=num>—</div></div></div><div class=card><div class=row><h2>👤 پروفایل</h2><span id=badge class=badge>—</span></div><div id=profile class=muted></div></div><div class=card><h2>🔔 اعلان‌ها</h2><div id=notifs>در حال بارگذاری...</div></div><div class=card><h2>📦 آخرین پک‌های من</h2><div id=myPosts>در حال بارگذاری...</div></div></main><script>const T=localStorage.getItem('exe_token')||'';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function A(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+T};let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}async function boot(){if(!T){$('msg').textContent='برای مشاهده پنل وارد حساب شو.';return}try{let m=await A('/api/me');$('msg').innerHTML='<b>'+esc(m.user.username)+'</b> · '+esc(m.user.email);$('posts').textContent=m.stats.posts||0;$('downloads').textContent=m.stats.downloads||0;$('views').textContent=m.stats.views||0;$('xp').textContent=m.stats.xp||0;$('badge').textContent=m.stats.badge||'🌱 ROOKIE';$('profile').textContent='نقش: '+m.user.role+' · عضویت: '+m.user.created_at;let n=await A('/api/notifications');$('notifs').innerHTML=n.notifications.length?n.notifications.map(x=>`<div class=item><b>${esc(x.title)}</b><div class=muted>${esc(x.body)} · ${esc(x.created_at)}</div></div>`).join(''):'اعلانی نیست';let p=await A('/api/users/'+m.user.id);$('myPosts').innerHTML=p.posts.length?p.posts.map(x=>`<div class=item><b>${esc(x.title)}</b><div class=muted>👁 ${x.view_count||0} · ⬇️ ${x.download_count||0} · ⭐ ${x.rating_avg||0}</div></div>`).join(''):'هنوز پستی نداری'}catch(e){$('msg').textContent=e.message}}boot();</script></body></html>
