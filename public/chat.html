<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>چت همگانی | EXE PAK</title><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f8f8fb;font-family:Vazirmatn,Arial}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 80% 0%,#8d32ff22,transparent 30%),radial-gradient(circle at 10% 40%,#00c7ff10,transparent 25%)}a{text-decoration:none;color:inherit}.wrap{max-width:900px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ffffff16;background:#ffffff08;color:#fff;padding:11px 15px;border-radius:12px;font:inherit;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#7f32ff,#e62f96)}.panel{background:#0d0f15;border:1px solid #ffffff12;border-radius:24px;padding:20px}.chat{height:75vh;min-height:520px;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:4px}.msg{margin:12px 0}.msg b{color:#c77aff}.bubble{display:inline-block;background:#ffffff09;border:1px solid #ffffff0d;padding:10px 13px;border-radius:13px;white-space:pre-wrap;max-width:90%;line-height:1.8}.formline{display:flex;gap:8px;margin-top:12px}.input{flex:1;background:#08090d;border:1px solid #ffffff16;color:#fff;padding:13px;border-radius:12px;font:inherit;outline:0}.hint{color:#858792;font-size:13px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.chat{min-height:70vh}.formline{flex-direction:column}}</style><div class="wrap"><div class="top"><div><h1 style="margin:0">💬 چت همگانی EXE PAK</h1><div class="hint">گفتگوی اعضای جامعه در یک صفحه جداگانه</div></div><a class="btn" href="/">← بازگشت به سایت</a></div><div class="panel chat"><div id="msgs" class="msgs"></div><div class="formline"><input id="chatIn" class="input" placeholder="پیامت را بنویس..."><button class="btn primary" onclick="send()">ارسال</button></div></div></div><script>let T=localStorage.getItem('exe_token')||'';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){o.headers={'content-type':'application/json',...(o.headers||{})};if(T)o.headers.Authorization='Bearer '+T;let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}async function load(){try{let c=await api('/api/chat');$('msgs').innerHTML=c.messages.map(m=>`<div class="msg"><b>${esc(m.username)} ${m.role==='admin'?'<span style="color:#ffcc62">👑 سازنده</span>':''}</b><div class="bubble">${esc(m.body)}</div></div>`).join('');$('msgs').scrollTop=$('msgs').scrollHeight}catch(e){}}async function send(){if(!T){location.href='/?login=1';return}let v=$('chatIn').value.trim();if(!v)return;try{await api('/api/chat',{method:'POST',body:JSON.stringify({body:v})});$('chatIn').value='';load()}catch(e){alert(e.message)}}$('chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});load();setInterval(load,5000)</script></html>
