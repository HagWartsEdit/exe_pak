<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب من | EXE PAK</title>
<style>
:root{--bg:#07070b;--p:#11111a;--p2:#161622;--line:#29293a;--text:#f5f5f7;--muted:#9c9cab;--a:#a855f7;--b:#ec4899;--good:#22c55e;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2b123d,#07070b 38%);color:var(--text);font-family:Tahoma,Arial}.wrap{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.logo{font-size:25px;font-weight:900}.logo span{color:#c084fc}a{color:inherit;text-decoration:none}.btn{border:1px solid #3a2949;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#14141e;border-color:#303044}.btn.danger{background:#35141a;border-color:#61202a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:linear-gradient(180deg,#12121b,#0d0d13);border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{font-size:26px;display:block;margin-top:7px}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:16px}.side{position:sticky;top:15px;height:max-content}.side button{display:block;width:100%;margin:7px 0;text-align:right}.tab{display:none}.tab.on{display:block}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid #252534;border-radius:12px;background:#0d0d14}.muted{color:var(--muted)}input{width:100%;background:#0b0b11;border:1px solid #2c2c3a;color:#fff;border-radius:10px;padding:12px;margin:6px 0}form{max-width:550px}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:5px 8px;border-radius:99px;background:#21142d;color:#d9b4ff;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{position:static}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><a class="logo" href="/">EXE <span>PAK</span></a><div class="actions"><a class="btn alt" href="/">بازگشت به سایت</a><button class="btn danger" id="logout">خروج</button></div></div>
<div id="loading" class="panel">در حال بارگذاری حساب...</div>
<div id="app" class="hidden">
<div class="grid"><div class="stat">نام کاربری<b id="sName">—</b></div><div class="stat">ایمیل<b id="sEmail">—</b></div><div class="stat">علاقه‌مندی‌ها<b id="sFav">0</b></div><div class="stat">دانلودهای من<b id="sDown">0</b></div></div>
<div class="layout"><aside class="panel side"><button class="btn tabBtn" data-tab="overview">داشبورد</button><button class="btn alt tabBtn" data-tab="favorites">علاقه‌مندی‌ها</button><button class="btn alt tabBtn" data-tab="downloads">تاریخچه دانلود</button><button class="btn alt tabBtn" data-tab="profile">پروفایل</button><button class="btn alt tabBtn" data-tab="security">امنیت حساب</button><a class="btn alt hidden" id="adminLink" href="/admin.html">پنل مدیریت</a></aside>
<main>
<section id="overview" class="tab on panel"><h2>خوش آمدی <span id="hello"></span> 👋</h2><p class="muted">از اینجا می‌توانی حساب، علاقه‌مندی‌ها و دانلودهایت را مدیریت کنی.</p><div class="panel"><h3>فعالیت اخیر</h3><div id="recent" class="list"></div></div></section>
<section id="favorites" class="tab panel"><h2>علاقه‌مندی‌ها</h2><div id="favList" class="list"></div></section>
<section id="downloads" class="tab panel"><h2>تاریخچه دانلود</h2><div id="downList" class="list"></div></section>
<section id="profile" class="tab panel"><h2>پروفایل</h2><form id="profileForm"><label>نام کاربری<input id="name" required minlength="2"></label><button class="btn">ذخیره تغییرات</button></form></section>
<section id="security" class="tab panel"><h2>امنیت حساب</h2><form id="passForm"><label>رمز فعلی<input id="old" type="password" required></label><label>رمز جدید<input id="new" type="password" minlength="8" required></label><button class="btn">تغییر رمز</button></form></section>
</main></div></div></div>
<script>
const token=()=>localStorage.getItem("exe_token")||"";const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const api=async(p,o={})=>{const h={"Content-Type":"application/json",Authorization:"Bearer "+token()};const r=await fetch("/api"+p,{...o,headers:h});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"خطا");return j};
let data;
function show(t){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));$("#"+t).classList.add("on");document.querySelectorAll(".tabBtn").forEach(x=>x.classList.toggle("alt",x.dataset.tab!==t))}
document.querySelectorAll(".tabBtn").forEach(x=>x.onclick=()=>show(x.dataset.tab));
async function load(){try{data=await api("/account");$("#loading").classList.add("hidden");$("#app").classList.remove("hidden");const u=data.user;$("#sName").textContent=u.name;$("#sEmail").textContent=u.email;$("#sFav").textContent=(data.favorites||[]).length;$("#sDown").textContent=(data.downloads||[]).length;$("#hello").textContent=u.name;$("#name").value=u.name;if(u.role==="admin")$("#adminLink").classList.remove("hidden");render();}catch(e){localStorage.removeItem("exe_token");location.href="/"}}
function render(){const fav=data.favorites||[],downs=data.downloads||[];$("#favList").innerHTML=fav.length?fav.map(x=>`<div class="row"><div><b>${esc(x.item_id)}</b><div class="muted">${esc(x.item_type==="pack"?"پک":"مود")}</div></div><span class="badge">ذخیره شده</span></div>`).join(""):'<div class="muted">هنوز موردی به علاقه‌مندی‌ها اضافه نکرده‌ای.</div>';$("#downList").innerHTML=downs.length?downs.map(x=>`<div class="row"><div><b>${esc(x.item_name||x.item_id)}</b><div class="muted">${esc(x.item_type==="pack"?"پک":"مود")}</div></div><span class="badge">${new Date(x.created_at.replace(" ","T")+"Z").toLocaleDateString("fa-IR")}</span></div>`).join(""):'<div class="muted">هنوز دانلودی ثبت نشده.</div>';$("#recent").innerHTML=downs.slice(0,5).map(x=>`<div class="row"><div>دانلود <b>${esc(x.item_name||"مورد")}</b></div><span class="muted">${esc(x.created_at)}</span></div>`).join("")||'<div class="muted">فعالیتی ثبت نشده.</div>'}
$("#profileForm").onsubmit=async e=>{e.preventDefault();try{await api("/account/profile",{method:"PATCH",body:JSON.stringify({name:$("#name").value})});alert("پروفایل ذخیره شد");await load()}catch(e){alert(e.message)}};
$("#passForm").onsubmit=async e=>{e.preventDefault();try{await api("/account/password",{method:"POST",body:JSON.stringify({currentPassword:$("#old").value,newPassword:$("#new").value})});e.target.reset();alert("رمز عبور تغییر کرد")}catch(e){alert(e.message)}};
$("#logout").onclick=()=>{localStorage.removeItem("exe_token");location.href="/"};load();
</script></body></html>
