<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE PAK Admin</title><style>
body{margin:0;background:#08080d;color:#eee;font-family:Tahoma,Arial;padding:25px}.wrap{max-width:900px;margin:auto}.box{background:#12121a;border:1px solid #2b2b3a;border-radius:16px;padding:18px;margin:12px 0}input,textarea{width:100%;box-sizing:border-box;margin:6px 0;padding:11px;border-radius:9px;border:1px solid #333;background:#09090e;color:#fff}.btn{padding:11px 15px;border:0;border-radius:10px;background:#9b5cff;color:#fff;font-weight:bold;cursor:pointer;margin:4px}pre{white-space:pre-wrap;color:#aaa}
</style></head><body><div class="wrap"><h1>EXE PAK Admin</h1><div class="box"><input id="token" placeholder="توکن مدیر"><button class="btn" id="load">بارگذاری مودها</button></div>
<div class="box"><h3>افزودن / ویرایش مود</h3><input id="id" placeholder="ID"><input id="name" placeholder="نام"><input id="category" placeholder="دسته"><input id="catName" placeholder="نام دسته"><textarea id="desc" placeholder="توضیحات"></textarea><input id="image" placeholder="لینک تصویر"><input id="download" placeholder="لینک دانلود"><input id="source" placeholder="لینک منبع"><input id="size" placeholder="حجم"><input id="version" placeholder="نسخه"><input id="author" placeholder="سازنده"><button class="btn" id="save">ذخیره</button></div>
<div class="box"><h3>ورود از زرگیم</h3><input id="zurl" placeholder="https://www.zargame.ir/post/..."><button class="btn" id="sync">دریافت اطلاعات</button><pre id="out"></pre></div><div class="box"><pre id="list">—</pre></div></div>
<script>
const $=x=>document.querySelector(x);const API="";async function call(p,o={}){const r=await fetch(API+"/api"+p,{...o,headers:{"Content-Type":"application/json",Authorization:"Bearer "+$("#token").value}});const j=await r.json();if(!r.ok)throw Error(j.error||"خطا");return j}
$("#save").onclick=async()=>{try{const x={id:$("#id").value||crypto.randomUUID(),name:$("#name").value,category:$("#category").value||"gameplay",categoryName:$("#catName").value,description:$("#desc").value,image:$("#image").value,downloadUrl:$("#download").value,sourceUrl:$("#source").value,size:$("#size").value,version:$("#version").value,author:$("#author").value,active:true};await call("/admin/mods",{method:"POST",body:JSON.stringify(x)});alert("ذخیره شد")}catch(e){alert(e.message)}};
$("#load").onclick=async()=>{try{const d=await call("/admin/mods");$("#list").textContent=JSON.stringify(d.results||d,null,2)}catch(e){alert(e.message)}};
$("#sync").onclick=async()=>{try{const d=await call("/admin/sync-zargame",{method:"POST",body:JSON.stringify({url:$("#zurl").value})});$("#out").textContent=JSON.stringify(d.item,null,2)}catch(e){alert(e.message)}};
</script></body></html>
