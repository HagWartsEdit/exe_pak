<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE PAK ADMIN</title><style>body{margin:0;background:#07070b;color:#eee;font-family:Arial,Vazirmatn}.w{max-width:1000px;margin:auto;padding:25px}.b{background:#111119;border:1px solid #fff2;border-radius:18px;padding:20px;margin:12px 0}input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#050509;color:#fff;border:1px solid #fff2;border-radius:10px;box-sizing:border-box}textarea{min-height:130px}button{padding:11px 16px;border:0;border-radius:10px;background:#9238ff;color:white;cursor:pointer;margin:4px}.danger{background:#b52c56}.edit{background:#0c8f9b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.n{display:block;font-size:30px;color:#c071ff;font-weight:900}.preview{width:180px;height:110px;object-fit:cover;border-radius:12px;border:1px solid #fff2;display:none;margin:8px 0}.post{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}.post img{width:140px;height:100px;object-fit:cover;border-radius:12px}.small{color:#aaa;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.post{grid-template-columns:1fr}.post img{width:100%;height:180px}}</style><div class=w><h1>⚡ EXE PAK ADMIN</h1><p id=e></p><div class=grid><div class=b>اعضا<strong id=u class=n>—</strong></div><div class=b>پست‌ها<strong id=p class=n>—</strong></div><div class=b>پیام‌ها<strong id=m class=n>—</strong></div></div><div class=b><h2 id=formTitle>➕ انتشار پست</h2><input id=t placeholder="عنوان"><select id=c><option>مود</option><option>خبر</option><option>آموزش</option><option>پک</option></select><input id=d placeholder="لینک دانلود"><input id=tags placeholder="تگ‌ها (مثلاً BMW, SA-MP, Police)"><label><input id=featured type=checkbox style="width:auto"> ⭐ ویژه</label><label><input id=staff type=checkbox style="width:auto"> 💎 انتخاب تیم</label><label>عکس کاور:</label><input id=f type=file accept="image/*"><img id=prev class=preview><input id=i placeholder="یا لینک مستقیم تصویر (اختیاری)"><textarea id=x placeholder="متن پست"></textarea><button onclick=save()>ذخیره پست</button><button id=cancel class=edit onclick=cancelEdit() style="display:none">انصراف از ویرایش</button><p class=small>عکس را مستقیم انتخاب کن؛ بهتر است حجم آن کمتر از 700KB باشد.</p></div><div class=b><h2>پست‌ها</h2><div id=list>...</div></div><div class=b><h2>🔔 اعلان کامیونیتی</h2><p class=small>ارسال اعلان داخلی به همه کاربران؛ بدون ایمیل.</p><input id="emailSubject" placeholder="عنوان اعلان"><textarea id="emailBody" placeholder="متن اعلان..."></textarea><button class=edit onclick="sendNotification()">🔔 ارسال اعلان به همه</button><div id="mailResult" class="small"></div></div></div></div><div class=b><h2>کاربران</h2><div id=users>...</div></div></div><script>let T=localStorage.getItem('exe_token')||'',editing=0,selectedImage='';const $=x=>document.getElementById(x);async function A(p,o={}){o.headers={...(o.headers||{}),'content-type':'application/json',Authorization:'Bearer '+T};let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('f').onchange=()=>{const file=$('f').files[0];if(!file)return;if(file.size>700*1024){$('e').textContent='حجم عکس زیاد است؛ لطفاً عکس کوچک‌تر از 700KB انتخاب کن.';$('f').value='';return}const rd=new FileReader();rd.onload=()=>{selectedImage=rd.result;$('prev').src=selectedImage;$('prev').style.display='block'};rd.readAsDataURL(file)};async function load(){try{let q=await A('/api/admin/posts'),pub=await A('/api/public'),us=await A('/api/admin/users');$('u').textContent=us.users.length;$('p').textContent=q.posts.length;$('m').textContent=pub.stats.messages;$('list').innerHTML=q.posts.map(v=>`<div class="b post"><div>${v.image_data||v.image_url?`<img src="${E(v.image_data||v.image_url)}">`:''}</div><div><b>${E(v.title)}</b><p>${E(v.body)}</p><div class=small>${E(v.category)} • 👁 ${v.view_count||0} بازدید • ⬇️ ${v.download_count||0} دانلود • 💬 ${v.comment_count||0} نظر ${v.download_url?'• لینک دانلود دارد':''}</div><button class=edit onclick='editPost(${v.id})'>✏️ ویرایش</button><button class=danger onclick=del(${v.id})>🗑️ حذف</button></div></div>`).join('')||'خالی';$('users').innerHTML=us.users.map(v=>`<div>${E(v.username)} — ${E(v.email)} — ${E(v.role)}</div>`).join('')}catch(z){$('e').textContent=z.message}}async function editPost(id){try{let q=await A('/api/admin/posts'),v=q.posts.find(x=>x.id==id);if(!v)return;editing=id;$('formTitle').textContent='✏️ ویرایش پست';$('t').value=v.title||'';$('c').value=v.category||'مود';$('d').value=v.download_url||'';$('i').value=v.image_url||'';$('x').value=v.body||'';$('tags').value=v.tags||'';$('featured').checked=!!v.featured;$('staff').checked=!!v.staff_pick;selectedImage=v.image_data||'';if(selectedImage){$('prev').src=selectedImage;$('prev').style.display='block'}else $('prev').style.display='none';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}catch(z){$('e').textContent=z.message}}async function save(){try{let payload={title:$('t').value,body:$('x').value,image_url:$('i').value,download_url:$('d').value,category:$('c').value,image_data:selectedImage,tags:$('tags').value,featured:$('featured').checked,staff_pick:$('staff').checked};await A(editing?('/api/admin/posts/'+editing):'/api/admin/posts',{method:editing?'PUT':'POST',body:JSON.stringify(payload)});cancelEdit();load()}catch(z){$('e').textContent=z.message}}function cancelEdit(){editing=0;selectedImage='';$('formTitle').textContent='➕ انتشار پست';$('t').value='';$('d').value='';$('i').value='';$('x').value='';$('tags').value='';$('featured').checked=false;$('staff').checked=false;$('f').value='';$('prev').style.display='none';$('cancel').style.display='none';$('e').textContent=''}async function del(id){if(confirm('این پست حذف شود؟')){await A('/api/admin/posts/'+id,{method:'DELETE'});load()}}

function renderRecipients(users){$('recipientBox').innerHTML=users.map(v=>`<label style="display:block;padding:6px"><input type=checkbox class="rc" value="${v.id}"> ${E(v.username)} — ${E(v.email)}</label>`).join('')}
async function sendEmail(){try{let ids=[...document.querySelectorAll('.rc:checked')].map(x=>Number(x.value));let mode=$('emailMode').value;let d=await A('/api/admin/email',{method:'POST',body:JSON.stringify({mode,user_ids:ids,subject:$('emailSubject').value,html:'<div dir=\"rtl\" style=\"font-family:Arial;line-height:2\">'+E($('emailBody').value).replace(/\n/g,'<br>')+'</div>'})});$('mailResult').textContent=`ارسال شد: ${d.sent} | ناموفق: ${d.failed}`;loadLogs()}catch(e){$('mailResult').textContent=e.message}}
async function sendNotification(){try{let d=await A('/api/admin/notify',{method:'POST',body:JSON.stringify({title:$('emailSubject').value,body:$('emailBody').value})});$('mailResult').textContent='اعلان برای همه کاربران ارسال شد.'}catch(e){$('mailResult').textContent=e.message}}
async function loadLogs(){try{let d=await A('/api/admin/email-logs');$('emailLogs').innerHTML=d.logs.length?d.logs.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fff1"><b>${E(x.subject)}</b><div class=small>${x.recipient_count} گیرنده • ${E(x.status)} • ${E(x.created_at)}</div></div>`).join(''):'هنوز ایمیلی ارسال نشده.'}catch(e){}}
const oldLoad=load;load=async function(){await oldLoad();try{let us=await A('/api/admin/users');renderRecipients(us.users);loadLogs()}catch(e){}};load();</script></html>
