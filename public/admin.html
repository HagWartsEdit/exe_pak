<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE PAK — NEXUS ADMIN</title><style>body{margin:0;background:#07070d;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:40px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box{background:#10101a;border:1px solid #ffffff12;border-radius:20px;padding:20px;margin:18px 0}.input{width:100%;padding:13px;margin:6px 0;background:#ffffff08;border:1px solid #ffffff12;color:#fff;border-radius:12px;box-sizing:border-box}.btn{padding:12px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c2cff,#ff2da7);color:#fff;font-weight:bold}.item{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #ffffff0d}</style></head><body><main><div class="top"><h1>⚡ NEXUS ADMIN</h1><button class="btn" onclick="location.href='/'">بازگشت به سایت</button></div><div class="grid"><div class="box"><h3>مودها</h3><b id="mc">0</b></div><div class="box"><h3>کاربران</h3><b id="uc">0</b></div><div class="box"><h3>آنلاین</h3><b id="oc">0</b></div></div><div class="box"><h2>افزودن مود</h2><input class="input" id="title" placeholder="عنوان"><input class="input" id="desc" placeholder="توضیحات"><input class="input" id="cat" placeholder="دسته‌بندی"><input class="input" id="ver" placeholder="نسخه"><input class="input" id="img" placeholder="لینک تصویر"><input class="input" id="url" placeholder="لینک دانلود"><button class="btn" onclick="addMod()">افزودن مود</button></div><div class="box"><h2>مودها</h2><div id="mods"></div></div><div class="box"><h2>کاربران</h2><div id="users"></div></div></main><script>const token=localStorage.token;const H={'Authorization':'Bearer '+token,'content-type':'application/json'};async function load(){let r=await fetch('/api/admin/mods',{headers:H});if(r.status!==200){document.body.innerHTML='<main><h2>دسترسی مجاز نیست.</h2></main>';return}let m=await r.json();mods.innerHTML=m.results.map(x=>`<div class=item><span>${x.title}</span><button class=btn onclick="del(${x.id})">حذف</button></div>`).join('');mc.textContent=m.results.length;let u=await fetch('/api/admin/users',{headers:H}).then(x=>x.json());users.innerHTML=(u.results||[]).map(x=>`<div class=item><span>${x.username} — ${x.email}</span><span>${x.role}</span></div>`).join('');uc.textContent=(u.results||[]).length;let s=await fetch('/api/public').then(x=>x.json());oc.textContent=s.stats.online_now||0}async function addMod(){await fetch('/api/admin/mods',{method:'POST',headers:H,body:JSON.stringify({title:title.value,description:desc.value,category:cat.value,version:ver.value,image_url:img.value,download_url:url.value})});load()}async function del(id){await fetch('/api/admin/mods/'+id,{method:'DELETE',headers:H});load()}load();</script></body></html>
