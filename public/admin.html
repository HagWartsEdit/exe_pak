<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE PAK ADMIN</title><style>body{margin:0;background:#07070b;color:#eee;font-family:Arial,Vazirmatn}.w{max-width:1000px;margin:auto;padding:25px}.b{background:#111119;border:1px solid #fff2;border-radius:18px;padding:20px;margin:12px 0}input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#050509;color:#fff;border:1px solid #fff2;border-radius:10px;box-sizing:border-box}textarea{min-height:130px}button{padding:11px 16px;border:0;border-radius:10px;background:#9238ff;color:white;cursor:pointer}.danger{background:#b52c56}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.n{display:block;font-size:30px;color:#c071ff;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><div class=w><h1>⚡ EXE PAK ADMIN</h1><p id=e></p><div class=grid><div class=b>اعضا<strong id=u class=n>—</strong></div><div class=b>پست‌ها<strong id=p class=n>—</strong></div><div class=b>پیام‌ها<strong id=m class=n>—</strong></div></div><div class=b><h2>➕ انتشار پست</h2><input id=t placeholder="عنوان"><select id=c><option>مود</option><option>خبر</option><option>آموزش</option><option>پک</option></select><input id=i placeholder="لینک تصویر اختیاری"><textarea id=x placeholder="متن پست"></textarea><button onclick=add()>انتشار پست</button></div><div class=b><h2>پست‌ها</h2><div id=list>...</div></div><div class=b><h2>کاربران</h2><div id=users>...</div></div></div><script>let T=localStorage.getItem('exe_token')||'';const $=x=>document.getElementById(x);async function A(p,o={}){o.headers={'content-type':'application/json',Authorization:'Bearer '+T};let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{let q=await A('/api/public');let us=await A('/api/admin/users');$('u').textContent=us.users.length;$('p').textContent=q.posts.length; $('m').textContent=q.stats.messages;$('list').innerHTML=q.posts.map(v=>`<div class=b><b>${E(v.title)}</b><p>${E(v.body)}</p><button class=danger onclick=del(${v.id})>حذف</button></div>`).join('')||'خالی';$('users').innerHTML=us.users.map(v=>`<div>${E(v.username)} — ${E(v.email)} — ${E(v.role)}</div>`).join('')}catch(z){$('e').textContent=z.message}}async function add(){try{await A('/api/admin/posts',{method:'POST',body:JSON.stringify({title:$('t').value,body:$('x').value,image_url:$('i').value,category:$('c').value})});$('t').value=$('x').value=$('i').value='';load()}catch(z){$('e').textContent=z.message}}async function del(id){if(confirm('حذف شود؟')){await A('/api/admin/posts/'+id,{method:'DELETE'});load()}}load()</script></html>
