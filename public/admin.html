<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE PAK Admin</title><style>body{margin:0;background:#08080d;color:#eee;font-family:Tahoma}.w{max-width:1100px;margin:auto;padding:22px}.g{display:grid;grid-template-columns:1fr 1fr;gap:15px}.b{background:#11111a;border:1px solid #28283a;border-radius:18px;padding:18px;margin:12px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #29293b;background:#090910;color:#eee}.p{background:linear-gradient(135deg,#a855f7,#ec4899);border:0}.hide{display:none}.muted{color:#999;font-size:12px}.it{border:1px solid #252535;border-radius:12px;padding:10px;margin:8px 0}@media(max-width:760px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>EXE PAK <span style="color:#ec4899">ADMIN</span></h1><div id="login" class="b"><input id="email" placeholder="ایمیل مدیر"><input id="pass" type="password" placeholder="رمز عبور"><button class="p" onclick="login()">ورود</button><div id="err" class="muted"></div></div><div id="panel" class="hide"><div class="g"><div class="b"><h2>مود</h2><input id="id" placeholder="ID برای ویرایش، خالی=جدید"><input id="title" placeholder="عنوان"><input id="cat" placeholder="دسته‌بندی"><input id="ver" placeholder="نسخه"><input id="img" placeholder="لینک تصویر"><input id="url" placeholder="لینک دانلود"><textarea id="desc" placeholder="توضیحات"></textarea><button class="p" onclick="saveMod()">ذخیره</button></div><div class="b"><h2>پک</h2><input id="pt" placeholder="عنوان"><input id="pu" placeholder="لینک دانلود"><input id="pi" placeholder="لینک تصویر"><textarea id="pd" placeholder="توضیحات"></textarea><button class="p" onclick="savePack()">افزودن پک</button><hr><h3>ZarGame</h3><input id="zu" placeholder="لینک صفحه ZarGame"><button onclick="sync()">دریافت اطلاعات</button></div></div><div class="b"><h2>مودهای فعلی</h2><div id="list"></div></div></div></div><script>let t=localStorage.getItem('exe_admin')||'';const $=x=>document.querySelector(x);async function api(p,o={}){o.headers={'Content-Type':'application/json',Authorization:'Bearer '+t};let r=await fetch('/api'+p,o),j=await r.json();if(!r.ok)throw Error(j.error||'خطا');return j}async function login(){try{let j=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});t=j.token;localStorage.setItem('exe_admin',t);let m=await api('/me');if(m.user.role!=='admin')throw Error('این حساب مدیر نیست');$('#login').classList.add('hide');$('#panel').classList.remove('hide');load()}catch(e){$('#err').textContent=e.message}}async function load(){let j=await api('/admin/mods');$('#list').innerHTML=j.items.map(x=>'<div class="it"><b>'+x.title+'</b><div class="muted">'+x.id+' • دانلود '+x.downloads+'</div><button onclick="edit(\''+x.id+'\')">ویرایش</button><button onclick="del(\''+x.id+'\')">حذف</button></div>').join('')||'<div class="muted">موردی نیست.</div>';window.mods=j.items}function edit(id){let x=window.mods.find(a=>a.id===id);for(let [k,v] of [['id',x.id],['title',x.title],['cat',x.category],['ver',x.version],['img',x.imageUrl],['url',x.downloadUrl],['desc',x.description]])$('#'+k).value=v||'';scrollTo(0,0)}async function saveMod(){try{await api('/admin/mods',{method:'POST',body:JSON.stringify({id:$('#id').value||undefined,title:$('#title').value,category:$('#cat').value,version:$('#ver').value,imageUrl:$('#img').value,downloadUrl:$('#url').value,description:$('#desc').value})});alert('ذخیره شد');load()}catch(e){alert(e.message)}}async function del(id){if(confirm('حذف شود؟')){await api('/admin/mods/'+id,{method:'DELETE'});load()}}async function savePack(){try{await api('/admin/packs',{method:'POST',body:JSON.stringify({title:$('#pt').value,downloadUrl:$('#pu').value,imageUrl:$('#pi').value,description:$('#pd').value})});alert('پک اضافه شد')}catch(e){alert(e.message)}}async function sync(){try{let x=await api('/admin/sync-zargame',{method:'POST',body:JSON.stringify({url:$('#zu').value})});$('#title').value=x.title||'';$('#desc').value=x.description||'';$('#img').value=x.imageUrl||'';$('#url').value=x.downloadUrl||'';alert('اطلاعات دریافت شد')}catch(e){alert(e.message)}}if(t)login()</script></body></html>
