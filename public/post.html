<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مود | EXE PAK</title><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#05060a;color:#f8f9ff;font-family:Vazirmatn,Tahoma}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 80% 0%,#8b5cf622,transparent 30%),radial-gradient(circle at 10% 40%,#9b5cff10,transparent 25%)}a{text-decoration:none;color:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #ffffff14;background:#ffffff07;color:#fff;padding:10px 14px;border-radius:13px;font:inherit;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#8b5cf6,#2563eb);box-shadow:0 10px 28px #8b5cf62b}.panel{border:1px solid #ffffff12;border-radius:24px;background:linear-gradient(145deg,#10141d,#090b10);padding:22px}.cover{width:100%;max-height:590px;object-fit:cover;border-radius:18px;background:#0a0c11}.pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:#8b5cf60d;border:1px solid #8b5cf62b;color:#ff9caf;font-size:11px}.meta{display:flex;gap:9px;flex-wrap:wrap;color:#8e96a6;font-size:12px;margin:13px 0}.body{white-space:pre-wrap;color:#c4cad5;line-height:2.15}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.rating{display:flex;gap:4px;align-items:center}.star{border:0;background:#ffffff08;color:#ffc857;border-radius:10px;padding:8px;cursor:pointer}.comments{margin-top:15px}.comment{padding:13px 0;border-bottom:1px solid #ffffff0e}.comment b{color:#c38cff}.reply{margin-right:25px;border-right:2px solid #ffffff12;padding-right:13px}.input{width:100%;background:#07090d;border:1px solid #ffffff14;color:#fff;padding:12px;border-radius:12px;font:inherit;outline:none}.form{display:flex;gap:8px;margin-top:14px}.related{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.rel{padding:13px;border:1px solid #ffffff10;border-radius:15px;background:#ffffff04}.muted{color:#8e96a6;font-size:12px}.toast{position:fixed;left:18px;bottom:18px;background:#111722;border:1px solid #ffffff18;padding:11px 14px;border-radius:12px;display:none}.toast.on{display:block}@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.form{flex-direction:column}.related{grid-template-columns:1fr 1fr}}
</style><div class="wrap"><div class="top"><div><div style="font-size:23px;font-weight:900"><span style="color:#8b5cf6">EXE</span> PAK</div><div class="muted">MOD DETAIL • COMMUNITY</div></div><div style="display:flex;gap:7px"><a class="btn" href="/">← بازگشت</a><a class="btn primary" href="/chat.html">💬 چت</a></div></div><article id="post" class="panel">در حال بارگذاری...</article><section class="panel comments"><h2 style="margin-top:0">💬 نظرات و گفتگو</h2><div id="comments">...</div><div class="form"><input id="commentIn" class="input" placeholder="نظر یا تجربه‌ات درباره این مود..."><button class="btn primary" onclick="sendComment()">ارسال</button></div><div id="err" class="muted"></div></section><section class="panel" style="margin-top:15px"><h2 style="margin-top:0">🎯 مودهای مرتبط</h2><div id="related" class="related"></div></section></div><div id="toast" class="toast"></div><script>let T=localStorage.getItem('exe_token')||'',id=Number(new URLSearchParams(location.search).get('id'));const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){o.headers={'content-type':'application/json',...(o.headers||{})};if(T)o.headers.Authorization='Bearer '+T;let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}function toast(s){$('toast').textContent=s;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}async function load(){try{let d=await api('/api/posts/'+id),p=d.post,im=p.image_data||p.image_url;$('post').innerHTML=`${im?`<img class="cover" src="${esc(im)}" alt="${esc(p.title)}">`:''}<div style="margin-top:19px"><span class="pill">${esc(p.category||'مود')}</span><h1 style="font-size:clamp(30px,5vw,52px);margin:12px 0">${esc(p.title)}</h1><div class="meta"><span>👁 ${p.view_count||0} بازدید</span><span>⬇ ${p.download_count||0} دانلود</span><span>💬 ${p.comment_count||0} نظر</span><span>❤️ ${p.favorite_count||0} علاقه</span><span>⭐ ${p.rating_avg||0}/5</span><span>✍️ <a href="/creator.html?id=${p.author_id}">${esc(p.author||'EXE PAK')}</a></span></div><div class="body">${esc(p.body)}</div><div class="actions">${p.download_url?`<a class="btn primary" href="/api/posts/${p.id}/download">⬇️ دانلود مود</a>`:''}<button id="fav" class="btn" onclick="favorite()">❤️ علاقه‌مندی</button><button class="btn" onclick="sharePost()">🔗 اشتراک‌گذاری</button><div class="rating"><span class="muted">امتیاز:</span>${[1,2,3,4,5].map(n=>`<button class="star" onclick="rate(${n})">${n}★</button>`).join('')}</div></div></div>`;let c=await api('/api/posts/'+id+'/comments');renderComments(c.comments||[]);$('related').innerHTML=(d.related||[]).map(x=>`<a class="rel" href="/post.html?id=${x.id}"><b>${esc(x.title)}</b><div class="muted">${esc(x.category||'مود')} · ⬇ ${x.download_count||0}</div></a>`).join('')||'<div class="muted">مورد مرتبطی نیست.</div>';engagement()}catch(e){$('post').textContent=e.message}}function renderComments(cs){let map={};cs.forEach(x=>map[x.id]=x);$('comments').innerHTML=cs.length?cs.map(x=>`<div class="comment ${x.parent_id?'reply':''}"><b>${esc(x.username)}</b> <span class="muted">${esc(x.created_at)}</span><p>${esc(x.body)}</p><button class="btn" style="font-size:11px;padding:5px 8px" onclick="replyTo(${x.id},'${esc(x.username)}')">↩ پاسخ</button></div>`).join(''):'<div class="muted">هنوز نظری ثبت نشده.</div>'}function replyTo(id,u){$('commentIn').value='@'+u+' ';$('commentIn').dataset.parent=id;$('commentIn').focus()}async function engagement(){try{let q=await api('/api/posts/'+id+'/engagement');$('fav').textContent=q.favorite?'💖 ذخیره شد':'❤️ علاقه‌مندی';}catch(e){}}async function favorite(){if(!T)return $('err').textContent='برای علاقه‌مندی وارد حساب شو.';try{await api('/api/posts/'+id+'/favorite',{method:'POST'});engagement();toast('وضعیت علاقه‌مندی تغییر کرد.')}catch(e){$('err').textContent=e.message}}async function rate(n){if(!T)return $('err').textContent='برای امتیاز دادن وارد حساب شو.';try{let q=await api('/api/posts/'+id+'/rating',{method:'POST',body:JSON.stringify({rating:n})});toast('امتیاز ثبت شد: '+q.average+'/5')}catch(e){$('err').textContent=e.message}}async function sharePost(){let url=location.href;try{if(navigator.share)await navigator.share({title:document.title,url});else{await navigator.clipboard.writeText(url);toast('لینک کپی شد.')}}catch(e){}}async function sendComment(){let v=$('commentIn').value.trim();if(!v)return;if(!T)return $('err').textContent='برای نظر دادن وارد حساب شو.';try{await api('/api/posts/'+id+'/comments',{method:'POST',body:JSON.stringify({body:v,parent_id:Number($('commentIn').dataset.parent)||null})});$('commentIn').value='';delete $('commentIn').dataset.parent;load()}catch(e){$('err').textContent=e.message}}if(!id){$('post').textContent='پست نامعتبر است.'}else{let key='exe_view_'+id;if(!sessionStorage.getItem(key)){fetch('/api/posts/'+id+'/view',{method:'POST'}).finally(()=>{sessionStorage.setItem(key,'1');load()})}else load()}$('commentIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendComment()}})</script></html>
