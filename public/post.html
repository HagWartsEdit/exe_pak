<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پست | EXE PAK</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f8f8fb;font-family:Vazirmatn,Arial}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 80% 0%,#8d32ff22,transparent 30%),radial-gradient(circle at 10% 40%,#00c7ff10,transparent 25%)}a{text-decoration:none;color:inherit}.wrap{max-width:1050px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #ffffff16;background:#ffffff08;color:#fff;padding:11px 15px;border-radius:12px;font:inherit;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#7f32ff,#e62f96)}.panel{background:#0d0f15;border:1px solid #ffffff12;border-radius:24px;padding:25px}.cover{width:100%;max-height:560px;object-fit:cover;border-radius:18px;background:#11131a}.tag{display:inline-flex;color:#c989ff;background:#a43cff12;border:1px solid #a43cff22;border-radius:99px;padding:6px 10px;font-size:12px}.meta{display:flex;gap:14px;flex-wrap:wrap;color:#898b97;margin:15px 0;font-size:13px}.body{color:#c4c5ce;line-height:2.1;white-space:pre-wrap}.comments{margin-top:18px}.comment{padding:14px 0;border-bottom:1px solid #ffffff10}.comment b{color:#c77aff}.comment p{margin:6px 0;color:#b5b6bf;line-height:1.9}.input{width:100%;background:#08090d;border:1px solid #ffffff16;color:#fff;padding:13px;border-radius:12px;font:inherit;outline:0}.formline{display:flex;gap:8px;margin-top:15px}.hint{color:#838590;font-size:13px}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column;gap:10px}.formline{flex-direction:column}}
</style><div class="wrap"><div class="top"><div><div style="font-size:22px;font-weight:900"><span style="color:#c77aff">EXE</span> PAK</div><div class="hint">جزئیات و دانلود پست</div></div><div style="display:flex;gap:8px"><a class="btn" href="/">← بازگشت</a><a class="btn primary" href="/chat.html">💬 چت همگانی</a></div></div><article id="post" class="panel">در حال بارگذاری...</article><section class="panel comments"><h2 style="margin-top:0">💬 نظرات کاربران</h2><div id="comments">در حال بارگذاری...</div><div class="formline"><input id="commentIn" class="input" placeholder="نظر خودت را بنویس..."><button class="btn primary" onclick="sendComment()">ارسال نظر</button></div><div id="err" class="hint"></div></section></div>
<script>let T=localStorage.getItem('exe_token')||'',id=Number(new URLSearchParams(location.search).get('id'));const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){o.headers={'content-type':'application/json',...(o.headers||{})};if(T)o.headers.Authorization='Bearer '+T;let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}async function load(){try{let d=await api('/api/posts/'+id),p=d.post,im=p.image_data||p.image_url;$('post').innerHTML=`${im?`<img class="cover" src="${esc(im)}" alt="${esc(p.title)}">`:''}<div style="margin-top:20px"><span class="tag">${esc(p.category||'مود')}</span><h1 style="font-size:clamp(28px,5vw,48px);margin:13px 0 8px">${esc(p.title)}</h1><div class="meta"><span>👁️ ${p.view_count||0} بازدید</span><span>📥 ${p.download_count||0} دانلود</span><span>💬 ${p.comment_count||0} نظر</span><span>✍️ ${esc(p.author||'EXE PAK')}</span><span id="eng">⭐ ...</span></div><div class="body">${esc(p.body)}</div><div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">${p.download_url?`<a class="btn primary" href="/api/posts/${p.id}/download">⬇️ دانلود فایل</a>`:'<span class="hint">لینک دانلود برای این پست ثبت نشده.</span>'}<button class="btn" onclick="favorite()">❤️ علاقه‌مندی</button><button class="btn" onclick="rate(5)">⭐ امتیاز ۵</button><button class="btn" onclick="rate(4)">⭐ ۴</button><button class="btn" onclick="rate(3)">⭐ ۳</button></div></div>`;let c=await api('/api/posts/'+id+'/comments');$('comments').innerHTML=c.comments.length?c.comments.map(x=>`<div class="comment"><b>${esc(x.username)}</b><span class="hint"> — ${esc(x.created_at)}</span><p>${esc(x.body)}</p></div>`).join(''):'<div class="hint">هنوز نظری ثبت نشده؛ اولین نفر باش.</div>'}catch(e){$('post').textContent=e.message}}async function engagement(){try{let q=await api('/api/posts/'+id+'/engagement');$('eng').textContent=`⭐ ${q.rating||0}/5 · ❤️ ${q.favorites||0}` }catch(e){}}
async function favorite(){if(!T){$('err').textContent='برای علاقه‌مندی ابتدا وارد حساب شو.';return}try{await api('/api/posts/'+id+'/favorite',{method:'POST'});engagement()}catch(e){$('err').textContent=e.message}}
async function rate(n){if(!T){$('err').textContent='برای امتیاز دادن ابتدا وارد حساب شو.';return}try{await api('/api/posts/'+id+'/rating',{method:'POST',body:JSON.stringify({rating:n})});engagement()}catch(e){$('err').textContent=e.message}}
async function sendComment(){let v=$('commentIn').value.trim();if(!v)return;if(!T){$('err').textContent='برای ثبت نظر ابتدا وارد حساب شو.';return}try{await api('/api/posts/'+id+'/comments',{method:'POST',body:JSON.stringify({body:v})});$('commentIn').value='';$('err').textContent='';load()}catch(e){$('err').textContent=e.message}}if(!id){$('post').textContent='پست نامعتبر است.'}else{let key='exe_view_'+id;if(!sessionStorage.getItem(key)){fetch('/api/posts/'+id+'/view',{method:'POST'}).finally(()=>{sessionStorage.setItem(key,'1');load()})}else load();engagement()}$('commentIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendComment()}})</script></html>
