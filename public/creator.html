<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator | EXE PAK</title><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font-family:Vazirmatn,Tahoma}.w{width:min(1100px,calc(100% - 28px));margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{padding:10px 14px;border-radius:12px;border:1px solid #ffffff14;background:#ffffff07;color:#fff;text-decoration:none;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ff3158,#ff8b2b)}.hero,.panel{border:1px solid #ffffff12;background:linear-gradient(145deg,#10141d,#090b10);border-radius:24px;padding:22px;margin-top:15px}.hero{display:flex;gap:18px;align-items:center}.avatar{width:88px;height:88px;border-radius:25px;display:grid;place-items:center;font-size:35px;background:linear-gradient(135deg,#ff3158,#9b5cff)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.stat{padding:12px;border:1px solid #ffffff10;border-radius:14px;background:#ffffff04}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #ffffff10;border-radius:17px;padding:14px;background:#ffffff04}.muted{color:#8e96a6;font-size:12px}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style><div class="w"><div class="top"><div><b style="font-size:23px"><span style="color:#ff3158">EXE</span> PAK</b><div class="muted">CREATOR PROFILE</div></div><a class="btn" href="/">← خانه</a></div><section id="hero" class="hero">در حال بارگذاری...</section><section class="panel"><h2>📦 انتشارهای این سازنده</h2><div id="grid" class="grid"></div></section></div><script>const id=Number(new URLSearchParams(location.search).get('id'));const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let r=await fetch('/api/users/'+id),d=await r.json();if(!r.ok)return $('hero').textContent=d.error||'خطا';let u=d.user,s=d.stats||{};$('hero').innerHTML=`<div class="avatar">👑</div><div style="flex:1"><div class="muted">${esc(s.badge||'🌱 ROOKIE')}</div><h1 style="margin:4px 0">${esc(u.username)}</h1><div class="muted">عضویت از ${esc(u.created_at)}</div><div class="stats"><div class="stat">⚡ ${s.xp||0} XP</div><div class="stat">📦 ${s.posts||0}</div><div class="stat">⬇️ ${s.downloads||0}</div><div class="stat">👁 ${s.views||0}</div><div class="stat">💬 ${s.comments||0}</div></div></div>`;$('grid').innerHTML=(d.posts||[]).map(p=>`<a class="card" href="/post.html?id=${p.id}"><b>${esc(p.title)}</b><div class="muted">${esc(p.category||'مود')} · ⬇ ${p.download_count||0} · 👁 ${p.view_count||0}</div></a>`).join('')||'<div class="muted">هنوز پستی ندارد.</div>'}if(id)load();</script></html>
