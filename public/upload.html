<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ارسال پک | EXE PAK</title><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font-family:Vazirmatn,Arial}.w{width:min(850px,calc(100% - 28px));margin:auto;padding:28px 0}.panel{background:linear-gradient(145deg,#11141d,#090b10);border:1px solid #ffffff12;border-radius:24px;padding:22px;margin-top:15px}.btn{padding:11px 16px;border-radius:12px;border:1px solid #ffffff14;background:#ffffff08;color:#fff;font:inherit;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ff3158,#ff8b2b)}.input,textarea,select{width:100%;background:#07080c;color:#fff;border:1px solid #ffffff15;border-radius:12px;padding:13px;font:inherit;margin:7px 0}textarea{min-height:150px}.muted{color:#8d94a4;font-size:13px}.preview{max-width:100%;max-height:300px;border-radius:15px;display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}</style><div class="w"><div class="top"><div><b style="font-size:25px"><span style="color:#ff3158">EXE</span> PAK</b><div class="muted">PUBLISHER CENTER</div></div><a class="btn" href="/">← خانه</a></div><div id="msg" class="panel">در حال بررسی دسترسی...</div><div id="form" class="panel" style="display:none"><h2>📦 انتشار پک جدید</h2><p class="muted">پست قبل از انتشار توسط سیستم بررسی می‌شود و ادمین می‌تواند آن را مدیریت کند.</p><input id="title" class="input" placeholder="عنوان پک"><select id="category"><option>پک</option><option>مود</option><option>ماشین</option><option>اسکین</option><option>اسلحه</option><option>مپ</option></select><input id="download" class="input" placeholder="لینک دانلود"><input id="imageUrl" class="input" placeholder="لینک تصویر (اختیاری)"><input id="file" class="input" type="file" accept="image/*"><img id="preview" class="preview"><input id="tags" class="input" placeholder="تگ‌ها، مثلاً BMW, SA-MP"><textarea id="body" placeholder="توضیحات کامل پک..."></textarea><button class="btn primary" onclick="send()">🚀 ارسال پک</button></div></div><script>let T=localStorage.getItem('exe_token')||'';const $=x=>document.getElementById(x);let imageData='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){o.headers={'content-type':'application/json',...(o.headers||{}),Authorization:'Bearer '+T};let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}async function init(){if(!T){$('msg').innerHTML='🔒 برای ارسال پک ابتدا وارد حساب شو.<br><br><a href="/" style="color:#ff6b6b">بازگشت به سایت</a>';return}try{let d=await api('/api/me');if(d.user.role==='admin'||d.user.upload_approved){$('msg').innerHTML=`سلام ${esc(d.user.username)} 👋<br><span class="muted">دسترسی انتشار برای حساب شما فعال است.</span>`;$('form').style.display='block'}else $('msg').innerHTML='⏳ دسترسی انتشار شما هنوز توسط ادمین تایید نشده است.<br><span class="muted">اگر می‌خواهی پک منتشر کنی، باید ادمین حساب تو را تایید کند.</span>'}catch(e){$('msg').textContent=e.message}}$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;if(f.size>700*1024){$('msg').textContent='عکس باید کمتر از 700KB باشد.';$('file').value='';return}let r=new FileReader();r.onload=()=>{imageData=r.result;$('preview').src=imageData;$('preview').style.display='block'};r.readAsDataURL(f)};async function send(){try{let d=await api('/api/uploads/posts',{method:'POST',body:JSON.stringify({title:$('title').value,body:$('body').value,image_url:$('imageUrl').value,download_url:$('download').value,category:$('category').value,tags:$('tags').value,image_data:imageData})});$('msg').innerHTML='✅ پک با موفقیت منتشر شد. <a href="/post.html?id='+d.id+'" style="color:#ff7b87">مشاهده پک</a>';$('form').style.display='none'}catch(e){$('msg').textContent=e.message}}init();</script></html>
