<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتشار پک | EXE PAK</title><style>body{margin:0;background:#05060a;color:#fff;font-family:Arial,Vazirmatn}.w{max-width:850px;margin:auto;padding:25px}.box{background:#10141d;border:1px solid #ffffff14;border-radius:22px;padding:22px;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#07090d;color:#fff;border:1px solid #ffffff16;border-radius:12px;padding:12px;margin:6px 0}textarea{min-height:160px}.btn{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#ff3158,#ff8b2b);color:#fff;cursor:pointer}.muted{color:#9aa2b2;font-size:13px}.cover{max-width:100%;max-height:260px;border-radius:14px;display:none}</style><div class=w><div class=box><h1>📦 انتشار پک</h1><p id=status class=muted>در حال بررسی دسترسی...</p></div><div id=form class=box style="display:none"><input id=title placeholder="عنوان پک"><select id=cat><option>مود</option><option>پک</option><option>ماشین</option><option>اسکین</option><option>اسلحه</option><option>مپ</option></select><input id=download placeholder="لینک دانلود"><input id=tags placeholder="تگ‌ها"><input id=file type=file accept="image/*"><img id=cover class=cover><textarea id=body placeholder="توضیحات کامل پک"></textarea><button class=btn onclick=send()>🚀 ارسال برای انتشار</button><p id=msg class=muted></p></div><a href="/" class=muted>← بازگشت به خانه</a></div><script>const T=localStorage.getItem('exe_token')||'', $=x=>document.getElementById(x);let img='';async function api(p,o={}){o.headers={'content-type':'application/json',Authorization:'Bearer '+T,...(o.headers||{})};let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}async function init(){try{let d=await api('/api/me');let u=d.user;if(u.role==='admin'||u.upload_approved){$('status').textContent='✅ دسترسی انتشار فعال است';$('form').style.display='block'}else $('status').textContent='⏳ هنوز توسط ادمین برای انتشار تأیید نشده‌ای.'}catch(e){$('status').textContent='ابتدا وارد حساب شو.'}}$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;if(f.size>650*1024){$('msg').textContent='حجم تصویر زیاد است.';return}let r=new FileReader();r.onload=()=>{img=r.result;$('cover').src=img;$('cover').style.display='block'};r.readAsDataURL(f)};async function send(){try{let d=await api('/api/upload',{method:'POST',body:JSON.stringify({title:$('title').value,category:$('cat').value,download_url:$('download').value,tags:$('tags').value,body:$('body').value,image_data:img})});$('msg').textContent='✅ پک با موفقیت منتشر شد. ID: '+d.id}catch(e){$('msg').textContent=e.message}}init();</script></html>
