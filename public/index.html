<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE PAK — NEXUS V5</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#05050a;color:#fff;font-family:Vazirmatn,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#8b2cff22,transparent 32%),radial-gradient(circle at 80% 20%,#ff187622,transparent 30%),linear-gradient(#05050a,#090613);z-index:-2}.grid{position:fixed;inset:0;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,black,transparent);z-index:-1}.nav{position:sticky;top:12px;z-index:20;margin:12px auto;max-width:1200px;padding:12px 16px;border:1px solid #ffffff14;border-radius:22px;background:#090911cc;backdrop-filter:blur(20px);display:flex;align-items:center;gap:18px}.logo{font-weight:900;font-size:23px;background:linear-gradient(90deg,#b55cff,#ff3bbd);-webkit-background-clip:text;color:transparent}.nav a{color:#bbb;text-decoration:none}.spacer{flex:1}.btn{border:0;border-radius:13px;padding:11px 17px;background:linear-gradient(135deg,#7c2cff,#ff2da7);color:white;font-weight:800;cursor:pointer;box-shadow:0 10px 35px #a32cff2b}.hero{max-width:1200px;margin:70px auto 25px;padding:40px 25px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.tag{display:inline-block;padding:7px 12px;border:1px solid #ffffff18;border-radius:999px;color:#d4aaff;background:#ffffff08}.hero h1{font-size:clamp(42px,8vw,82px);line-height:1;margin:18px 0}.grad{background:linear-gradient(90deg,#fff,#d873ff,#ff4fbd);-webkit-background-clip:text;color:transparent}.hero p{color:#a8a8b7;font-size:18px;line-height:2}.orb{height:330px;border-radius:50%;background:radial-gradient(circle,#ff43bb55 0 5%,transparent 28%),radial-gradient(circle,#7d35ff66 0 15%,transparent 50%);filter:blur(.2px);animation:float 5s ease-in-out infinite}.stats{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:10px 20px}.stat{padding:20px;border:1px solid #ffffff12;background:#ffffff07;border-radius:20px}.stat b{display:block;font-size:30px}.stat span{color:#888}.online{color:#55ffb0}.wrap{max-width:1200px;margin:50px auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h2{font-size:30px}.muted{color:#8e8e9e}.search{width:300px;max-width:100%;padding:13px 16px;border-radius:14px;border:1px solid #ffffff12;background:#ffffff08;color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{position:relative;overflow:hidden;border:1px solid #ffffff10;background:linear-gradient(145deg,#ffffff09,#ffffff03);border-radius:22px;padding:18px;transition:.35s}.card:hover{transform:translateY(-8px);border-color:#c14dff66;box-shadow:0 20px 60px #9e2cff18}.thumb{height:170px;border-radius:16px;background:linear-gradient(135deg,#7c2cff44,#ff238844),#111;display:grid;place-items:center;font-size:48px;margin-bottom:15px}.card h3{margin:5px 0}.card p{color:#9696a7;min-height:52px;line-height:1.8}.meta{display:flex;justify-content:space-between;color:#888;font-size:13px;margin:12px 0}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:50}.modal.show{display:flex}.box{width:min(460px,92vw);border:1px solid #ffffff16;background:#0d0b15;border-radius:28px;padding:28px;box-shadow:0 30px 100px #000}.box h2{margin-top:0}.input{width:100%;margin:7px 0;padding:14px;border-radius:13px;border:1px solid #ffffff13;background:#ffffff08;color:#fff;outline:0}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;padding:11px;border:0;border-radius:12px;background:#ffffff08;color:#aaa;cursor:pointer}.tab.active{background:#792aff;color:#fff}.toast{position:fixed;bottom:25px;left:25px;background:#11101a;border:1px solid #ffffff18;padding:14px 18px;border-radius:14px;display:none;z-index:90}@keyframes float{50%{transform:translateY(-18px) rotate(3deg)}}@media(max-width:800px){.hero{grid-template-columns:1fr;margin-top:35px}.orb{height:220px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.nav a{display:none}}
</style></head><body><div class="grid"></div><nav class="nav"><div class="logo">EXE PAK</div><a href="#mods">مودها</a><a href="#packs">پک‌ها</a><a href="#stats">آمار زنده</a><div class="spacer"></div><button class="btn" id="account">ورود / ثبت‌نام</button></nav><main><section class="hero"><div><span class="tag">NEXUS V5 • GAMING HUB</span><h1>دنیای جدید<br><span class="grad">EXE PAK</span></h1><p>مرجع مدرن مود، پک و محتوای گیمینگ؛ سریع، زنده و ساخته‌شده برای گیمرها.</p><button class="btn" onclick="document.querySelector('#mods').scrollIntoView({behavior:'smooth'})">شروع گشت‌وگذار ✦</button></div><div class="orb"></div></section><section id="stats" class="stats"><div class="stat"><b id="online">0</b><span>کاربر آنلاین</span></div><div class="stat"><b id="visits">0</b><span>بازدید</span></div><div class="stat"><b id="downloads">0</b><span>دانلود</span></div><div class="stat"><b id="users">0</b><span>عضو</span></div></section><section id="mods" class="wrap"><div class="head"><div><h2>مودهای جدید</h2><div class="muted">آخرین محتوای EXE PAK</div></div><input class="search" id="search" placeholder="جستجوی مود..."></div><div class="cards" id="modsGrid"></div></section><section id="packs" class="wrap"><div class="head"><div><h2>پک‌ها</h2><div class="muted">مجموعه‌های آماده</div></div></div><div class="cards" id="packsGrid"></div></section></main><div class="modal" id="modal"><div class="box"><div class="tabs"><button class="tab active" id="loginTab">ورود</button><button class="tab" id="regTab">ساخت حساب</button></div><div id="loginForm"><h2>خوش برگشتی 👋</h2><input class="input" id="li" placeholder="ایمیل یا نام کاربری"><input class="input" id="lp" type="password" placeholder="رمز عبور"><button class="btn" style="width:100%;margin-top:10px" onclick="login()">ورود به EXE PAK</button></div><div id="regForm" style="display:none"><h2>به خانواده EXE PAK بپیوند 🚀</h2><input class="input" id="ru" placeholder="نام کاربری"><input class="input" id="re" placeholder="ایمیل"><input class="input" id="rp" type="password" placeholder="رمز عبور حداقل ۶ کاراکتر"><button class="btn" style="width:100%;margin-top:10px" onclick="register()">ساخت حساب</button></div><button onclick="closeModal()" style="width:100%;margin-top:12px;background:none;border:0;color:#777">بستن</button></div></div><div class="toast" id="toast"></div><script>
const API='/api';let data={mods:[],packs:[]};let session=localStorage.nexus_session||'';const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}async function load(){const r=await fetch(API+'/public');data=await r.json();render();setStats(data.stats)}function setStats(s){$('online').textContent=s.online_now||0;$('visits').textContent=(s.total_visits||0).toLocaleString('fa-IR');$('downloads').textContent=(s.total_downloads||0).toLocaleString('fa-IR');$('users').textContent=(s.total_users||0).toLocaleString('fa-IR')}function render(){const q=($('search').value||'').toLowerCase();$('modsGrid').innerHTML=data.mods.filter(x=>x.title.toLowerCase().includes(q)).map(x=>`<article class="card"><div class="thumb">🎮</div><h3>${x.title}</h3><p>${x.description||'یک مود جدید برای EXE PAK'}</p><div class="meta"><span>${x.category}</span><span>⬇ ${x.downloads}</span></div><button class="btn" onclick="download(${x.id})">دریافت مود</button></article>`).join('');$('packsGrid').innerHTML=data.packs.map(x=>`<article class="card"><div class="thumb">📦</div><h3>${x.title}</h3><p>${x.description||'پک اختصاصی EXE PAK'}</p><div class="meta"><span>PACK</span><span>⬇ ${x.downloads}</span></div><button class="btn" onclick="downloadPack(${x.id})">دریافت پک</button></article>`).join('')}async function ping(){const r=await fetch(API+'/ping',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId:session})});const d=await r.json();session=d.sessionId;localStorage.nexus_session=session;setStats(d.stats)}function download(id){fetch(API+'/download',{method:'POST',headers:{'content-type':'application/json',...(localStorage.token?{Authorization:'Bearer '+localStorage.token}:{})},body:JSON.stringify({mod_id:id})});toast('دانلود ثبت شد ✦');const m=data.mods.find(x=>x.id===id);if(m&&m.download_url&&m.download_url!=='#')location.href=m.download_url}function downloadPack(id){fetch(API+'/download',{method:'POST',headers:{'content-type':'application/json',...(localStorage.token?{Authorization:'Bearer '+localStorage.token}:{})},body:JSON.stringify({pack_id:id})});toast('دانلود ثبت شد ✦')}function closeModal(){$('modal').classList.remove('show')}$('account').onclick=()=>{$('modal').classList.add('show')};$('loginTab').onclick=()=>{loginTab.classList.add('active');regTab.classList.remove('active');loginForm.style.display='block';regForm.style.display='none'};$('regTab').onclick=()=>{regTab.classList.add('active');loginTab.classList.remove('active');loginForm.style.display='none';regForm.style.display='block'};$('search').oninput=render;async function register(){const r=await fetch(API+'/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:ru.value,email:re.value,password:rp.value})});const d=await r.json();toast(d.ok?'حساب با موفقیت ساخته شد 🎉':d.error);if(d.ok)loginTab.click()}async function login(){const r=await fetch(API+'/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identity:li.value,password:lp.value})});const d=await r.json();if(d.token){localStorage.token=d.token;toast('خوش آمدی '+d.user.username+' ✦');closeModal();$('account').textContent='حساب من';if(d.user.role==='admin')$('account').onclick=()=>location.href='/admin.html'}else toast(d.error||'خطا در ورود')}load();ping();setInterval(ping,30000);setInterval(load,30000);
</script></body></html>
